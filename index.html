<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161b;
    --surface: #1b1e25;
    --surface-raised: #23272f;
    --border: #33394a;
    --text: #e9e6df;
    --muted: #8a8f9c;
    --accent: #d1a054;
    --accent-dim: #8a6d3a;
    --rust: #b5563f;
    --sage: #7a8a72;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  ::selection{ background:var(--accent-dim); color:#fff; }

  .app{ max-width:960px; margin:0 auto; padding:32px 20px 80px; }

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:28px; flex-wrap:wrap; gap:12px;
  }
  header.top h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:2rem;
    margin:0; letter-spacing:-0.01em;
  }
  header.top h1 span{ color:var(--accent); }

  nav.tabs{
    display:flex; gap:2px; margin-bottom:28px;
    border-bottom:1px solid var(--border);
  }
  nav.tabs button{
    font-family:'JetBrains Mono', monospace;
    background:none; border:none; color:var(--muted);
    font-size:0.85rem; letter-spacing:0.06em; text-transform:uppercase;
    padding:12px 18px; cursor:pointer; position:relative; top:1px;
    border-bottom:2px solid transparent;
    transition:color .15s ease;
  }
  nav.tabs button:hover{ color:var(--text); }
  nav.tabs button.active{
    color:var(--accent); border-bottom:2px solid var(--accent);
  }

  .panel{ display:none; }
  .panel.active{ display:block; }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:'Inter', sans-serif; font-size:0.85rem; font-weight:600;
    background:var(--surface-raised); color:var(--text);
    border:1px solid var(--border); border-radius:6px;
    padding:9px 16px; cursor:pointer; transition:border-color .15s ease, color .15s ease;
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn.primary{
    background:var(--accent); color:#1a1608; border-color:var(--accent);
  }
  .btn.primary:hover{ filter:brightness(1.08); color:#1a1608; }
  .icon-btn{
    background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:1rem; line-height:1; padding:4px 6px; border-radius:4px;
  }
  .icon-btn:hover{ color:var(--rust); background:rgba(181,86,63,0.12); }

  /* ---------- Characters ---------- */
  .char-toolbar{ margin-bottom:20px; }
  .char-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
  }
  .char-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:18px; position:relative;
    border-top:3px solid var(--accent-dim);
  }
  .char-card .card-head{
    display:flex; align-items:flex-start; gap:8px; margin-bottom:14px;
  }
  .name-input{
    flex:1; background:none; border:none; border-bottom:1px solid transparent;
    font-family:'Fraunces', serif; font-weight:600; font-size:1.25rem;
    color:var(--text); padding:2px 0; outline:none;
  }
  .name-input::placeholder{ color:var(--muted); font-weight:400; }
  .name-input:focus{ border-bottom:1px solid var(--accent); }

  .field-row{
    display:flex; gap:8px; align-items:flex-start; margin-bottom:8px;
  }
  .field-label{
    width:38%; flex-shrink:0;
    font-family:'JetBrains Mono', monospace; font-size:0.68rem;
    text-transform:uppercase; letter-spacing:0.05em; color:var(--sage);
    background:none; border:none; border-bottom:1px dashed var(--border);
    padding:5px 2px; outline:none;
  }
  .field-label:focus{ border-bottom:1px dashed var(--accent); color:var(--accent); }
  .field-value{
    flex:1; font-family:'JetBrains Mono', monospace; font-size:0.82rem;
    background:var(--surface-raised); color:var(--text); border:1px solid var(--border);
    border-radius:5px; padding:6px 8px; resize:vertical; min-height:34px; outline:none;
  }
  .field-value:focus{ border-color:var(--accent); }
  .field-row .icon-btn{ margin-top:4px; }

  .add-field-btn{
    font-family:'JetBrains Mono', monospace; font-size:0.72rem;
    color:var(--muted); background:none; border:none; cursor:pointer;
    padding:6px 2px; letter-spacing:0.03em;
  }
  .add-field-btn:hover{ color:var(--accent); }

  .empty-state{
    color:var(--muted); font-family:'JetBrains Mono', monospace; font-size:0.85rem;
    padding:40px 0; text-align:center; border:1px dashed var(--border); border-radius:10px;
  }

  /* ---------- Scenes: filmstrip ---------- */
  .scene-toolbar{ margin-bottom:20px; }
  .scene-list{ display:flex; flex-direction:column; gap:10px; }

  .scene-card{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; overflow:hidden;
  }
  .scene-card.dragging{ opacity:0.55; }

  .sprockets{
    width:34px; flex-shrink:0; background:#0f1013;
    display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
    cursor:grab; border-right:1px solid var(--border);
    touch-action:none;
  }
  .sprockets:active{ cursor:grabbing; }
  .sprockets .hole{
    width:9px; height:9px; border-radius:2px; background:var(--bg);
    border:1px solid var(--border);
  }

  .scene-body{ flex:1; padding:16px 18px; min-width:0; }
  .scene-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .scene-number{
    font-family:'JetBrains Mono', monospace; font-size:0.72rem;
    color:var(--accent); letter-spacing:0.08em; text-transform:uppercase;
  }
  .scene-desc{
    width:100%; background:var(--surface-raised); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:10px 12px;
    font-family:'Inter', sans-serif; font-size:0.95rem; resize:vertical; min-height:44px;
    outline:none; margin-bottom:12px;
  }
  .scene-desc:focus{ border-color:var(--accent); }
  .scene-desc::placeholder{ color:var(--muted); }

  .chip-label{
    font-family:'JetBrains Mono', monospace; font-size:0.66rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family:'Inter', sans-serif; font-size:0.78rem; padding:5px 11px;
    border-radius:999px; border:1px solid var(--border); background:var(--surface-raised);
    color:var(--muted); cursor:pointer; transition:all .15s ease; user-select:none;
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.selected{
    background:var(--accent-dim); color:#fff2dc; border-color:var(--accent);
  }
  .chip.none{ font-style:italic; }

  footer.savebar{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:center; pointer-events:none;
  }
  .save-indicator{
    pointer-events:none; font-family:'JetBrains Mono', monospace; font-size:0.68rem;
    color:var(--muted); background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:6px 14px; margin-bottom:14px; opacity:0; transition:opacity .3s ease;
  }
  .save-indicator.show{ opacity:1; }
  .save-indicator.error{ color:#f2b8ab; border-color:var(--rust); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Script<span>Room</span></h1>
    <button class="btn" id="downloadBtn">⬇ Download backup</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="characters">Characters</button>
    <button class="tab-btn" data-tab="scenes">Scenes</button>
  </nav>

  <section class="panel active" id="panel-characters">
    <div class="char-toolbar">
      <button class="btn primary" id="addCharacterBtn">+ New Character</button>
    </div>
    <div class="char-grid" id="charGrid"></div>
  </section>

  <section class="panel" id="panel-scenes">
    <div class="scene-toolbar">
      <button class="btn primary" id="addSceneBtn">+ New Scene</button>
    </div>
    <div class="scene-list" id="sceneList"></div>
  </section>
</div>

<footer class="savebar"><div class="save-indicator" id="saveIndicator">saved</div></footer>

<script>
(function(){
  const DATA_KEY = 'screenplay:data';

  // Fields are shared across all characters, like columns in a cast sheet.
  let characterFields = [];
  let characters = [];
  let scenes = [];

  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

  function defaultFields(){
    return [
      { id: uid('f'), label: 'Role' },
      { id: uid('f'), label: 'Description' }
    ];
  }

  // ---------- Persistence ----------
  // Running outside Claude, so we persist with localStorage: instant, no
  // network round trip, and it survives refreshes on this device/browser.
  let saveTimer = null;

  function persist(){
    try{
      const payload = JSON.stringify({ characterFields, characters, scenes });
      localStorage.setItem(DATA_KEY, payload);
      flashSaved(false);
    }catch(e){
      console.error('Save failed', e);
      flashSaved(true);
    }
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  function flashSaved(isError){
    const el = document.getElementById('saveIndicator');
    el.textContent = isError ? 'could not save' : 'saved';
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(flashSaved._t);
    if(!isError){
      flashSaved._t = setTimeout(()=> el.classList.remove('show'), 1200);
    }
  }

  function loadAll(){
    try{
      const raw = localStorage.getItem(DATA_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        characterFields = parsed.characterFields || [];
        characters = parsed.characters || [];
        scenes = parsed.scenes || [];
      }
    }catch(e){
      // no existing data yet, start fresh
    }
    renderCharacters();
    renderScenes();
  }

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab === 'scenes') renderScenes();
    });
  });

  // ---------- Characters ----------
  function addCharacter(){
    if(characterFields.length === 0){
      characterFields = defaultFields();
    }
    characters.push({ id: uid('c'), name: '', values: {} });
    renderCharacters();
    scheduleSave();
    const inputs = document.querySelectorAll('.char-card .name-input');
    if(inputs.length) inputs[inputs.length-1].focus();
  }

  function addFieldGlobally(){
    characterFields.push({ id: uid('f'), label: 'New field' });
    renderCharacters();
    scheduleSave();
  }

  function removeFieldGlobally(fieldId){
    characterFields = characterFields.filter(f=> f.id !== fieldId);
    characters.forEach(ch=>{ delete ch.values[fieldId]; });
    renderCharacters();
    scheduleSave();
  }

  function renderCharacters(){
    const grid = document.getElementById('charGrid');
    grid.innerHTML = '';

    characters.forEach(ch=>{
      const card = document.createElement('div');
      card.className = 'char-card';

      const head = document.createElement('div');
      head.className = 'card-head';
      const nameInput = document.createElement('input');
      nameInput.className = 'name-input';
      nameInput.placeholder = 'Character name';
      nameInput.value = ch.name;
      nameInput.addEventListener('input', ()=>{ ch.name = nameInput.value; scheduleSave(); syncSceneChipLabels(); });
      const delCharBtn = document.createElement('button');
      delCharBtn.className = 'icon-btn';
      delCharBtn.title = 'Remove character';
      delCharBtn.textContent = '✕';
      delCharBtn.addEventListener('click', ()=>{
        characters = characters.filter(c=>c.id !== ch.id);
        scenes.forEach(sc=> sc.characterIds = sc.characterIds.filter(id=> id !== ch.id));
        renderCharacters(); renderScenes(); scheduleSave();
      });
      head.appendChild(nameInput);
      head.appendChild(delCharBtn);
      card.appendChild(head);

      characterFields.forEach(f=>{
        card.appendChild(renderFieldRow(ch, f));
      });

      const addFieldBtn = document.createElement('button');
      addFieldBtn.className = 'add-field-btn';
      addFieldBtn.textContent = '+ add field to all characters';
      addFieldBtn.addEventListener('click', addFieldGlobally);
      card.appendChild(addFieldBtn);

      grid.appendChild(card);
    });

    if(characters.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.style.gridColumn = '1 / -1';
      empty.textContent = 'No characters yet. Add one to start building your cast.';
      grid.appendChild(empty);
    }
  }

  function renderFieldRow(ch, f){
    const row = document.createElement('div');
    row.className = 'field-row';

    const labelInput = document.createElement('input');
    labelInput.className = 'field-label';
    labelInput.value = f.label;
    labelInput.dataset.fieldId = f.id;
    labelInput.addEventListener('input', ()=>{
      f.label = labelInput.value;
      document.querySelectorAll('.field-label[data-field-id="' + f.id + '"]').forEach(input=>{
        if(input !== labelInput) input.value = f.label;
      });
      scheduleSave();
    });

    const valueArea = document.createElement('textarea');
    valueArea.className = 'field-value';
    valueArea.rows = 1;
    valueArea.value = ch.values[f.id] || '';
    valueArea.addEventListener('input', ()=>{ ch.values[f.id] = valueArea.value; scheduleSave(); });

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn';
    delBtn.title = 'Remove this field from all characters';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', ()=> removeFieldGlobally(f.id));

    row.appendChild(labelInput);
    row.appendChild(valueArea);
    row.appendChild(delBtn);
    return row;
  }

  function syncSceneChipLabels(){
    document.querySelectorAll('.chip[data-char-id]').forEach(chip=>{
      const ch = characters.find(c=> c.id === chip.dataset.charId);
      if(ch) chip.textContent = ch.name || 'Unnamed';
    });
  }

  document.getElementById('addCharacterBtn').addEventListener('click', addCharacter);

  // ---------- Scenes ----------
  function addScene(){
    scenes.push({ id: uid('s'), description: '', characterIds: [] });
    renderScenes();
    scheduleSave();
    const areas = document.querySelectorAll('.scene-desc');
    if(areas.length) areas[areas.length-1].focus();
  }

  function renderScenes(){
    const list = document.getElementById('sceneList');
    list.innerHTML = '';

    if(scenes.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No scenes yet. Add one to start blocking out the story.';
      list.appendChild(empty);
      return;
    }

    scenes.forEach((sc, idx)=>{
      const card = document.createElement('div');
      card.className = 'scene-card';
      card.dataset.id = sc.id;

      const sprockets = document.createElement('div');
      sprockets.className = 'sprockets';
      for(let i=0;i<5;i++){
        const hole = document.createElement('div');
        hole.className = 'hole';
        sprockets.appendChild(hole);
      }
      attachDragHandlers(sprockets, sc.id);

      const body = document.createElement('div');
      body.className = 'scene-body';

      const headRow = document.createElement('div');
      headRow.className = 'scene-head';
      const num = document.createElement('div');
      num.className = 'scene-number';
      num.textContent = 'Scene ' + String(idx+1).padStart(2,'0');
      headRow.appendChild(num);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.title = 'Remove scene';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', ()=>{
        scenes = scenes.filter(s=> s.id !== sc.id);
        renderScenes(); scheduleSave();
      });
      headRow.appendChild(delBtn);
      body.appendChild(headRow);

      const desc = document.createElement('textarea');
      desc.className = 'scene-desc';
      desc.rows = 2;
      desc.placeholder = 'What happens in this scene?';
      desc.value = sc.description;
      desc.addEventListener('input', ()=>{ sc.description = desc.value; scheduleSave(); });
      body.appendChild(desc);

      const chipLabel = document.createElement('div');
      chipLabel.className = 'chip-label';
      chipLabel.textContent = 'Characters present';
      body.appendChild(chipLabel);

      const chipRow = document.createElement('div');
      chipRow.className = 'chip-row';
      if(characters.length === 0){
        const none = document.createElement('span');
        none.className = 'chip none';
        none.textContent = 'Add characters in the Characters tab first';
        chipRow.appendChild(none);
      }else{
        characters.forEach(ch=>{
          const chip = document.createElement('button');
          chip.className = 'chip' + (sc.characterIds.includes(ch.id) ? ' selected' : '');
          chip.dataset.charId = ch.id;
          chip.textContent = ch.name || 'Unnamed';
          chip.addEventListener('click', ()=>{
            if(sc.characterIds.includes(ch.id)){
              sc.characterIds = sc.characterIds.filter(id=> id !== ch.id);
            }else{
              sc.characterIds.push(ch.id);
            }
            renderScenes(); scheduleSave();
          });
          chipRow.appendChild(chip);
        });
      }
      body.appendChild(chipRow);

      card.appendChild(sprockets);
      card.appendChild(body);
      list.appendChild(card);
    });
  }

  // ---------- Drag to reorder ----------
  // Index-based: total drag distance determines target slot directly, so a
  // scene can move several places in one continuous gesture, not just one at a time.
  let drag = null;

  function attachDragHandlers(handle, sceneId){
    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      const card = handle.closest('.scene-card');
      const rect = card.getBoundingClientRect();
      const gap = 10;
      drag = {
        sceneId: sceneId,
        pointerId: e.pointerId,
        startClientY: e.clientY,
        startIndex: scenes.findIndex(s=> s.id === sceneId),
        stepHeight: rect.height + gap
      };
      card.classList.add('dragging');
      handle.setPointerCapture(e.pointerId);
    });

    handle.addEventListener('pointermove', onDragMove);
    handle.addEventListener('pointerup', onDragEnd);
    handle.addEventListener('pointercancel', onDragEnd);
  }

  function onDragMove(e){
    if(!drag || e.pointerId !== drag.pointerId) return;
    const deltaY = e.clientY - drag.startClientY;
    const shift = Math.round(deltaY / drag.stepHeight);
    const targetIndex = Math.max(0, Math.min(scenes.length - 1, drag.startIndex + shift));
    const currentIndex = scenes.findIndex(s=> s.id === drag.sceneId);
    if(targetIndex !== currentIndex){
      const [moved] = scenes.splice(currentIndex, 1);
      scenes.splice(targetIndex, 0, moved);
      renderScenes();
      const newCard = document.querySelector('.scene-card[data-id="' + drag.sceneId + '"]');
      if(newCard){
        newCard.classList.add('dragging');
        const newHandle = newCard.querySelector('.sprockets');
        try{ newHandle.setPointerCapture(drag.pointerId); }catch(err){}
      }
    }
  }

  function onDragEnd(e){
    if(!drag || e.pointerId !== drag.pointerId) return;
    const card = document.querySelector('.scene-card[data-id="' + drag.sceneId + '"]');
    if(card) card.classList.remove('dragging');
    drag = null;
    scheduleSave();
  }

  document.getElementById('addSceneBtn').addEventListener('click', addScene);

  // ---------- Download backup ----------
  function downloadBackup(){
    const payload = JSON.stringify({ characterFields, characters, scenes }, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'scriptroom-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('downloadBtn').addEventListener('click', downloadBackup);

  // ---------- Init ----------
  loadAll();
})();
</script>
</body>
</html>
